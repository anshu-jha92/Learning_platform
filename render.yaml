# Render blueprint — https://render.com/docs/blueprint-spec
#
# NOTE ON STORAGE: set MONGODB_URI and all practice data lives in MongoDB Atlas,
# so it survives deploys and spin-downs. In Atlas -> Network Access, allow
# 0.0.0.0/0 — Render's outbound IP addresses are not fixed.
#
# Without MONGODB_URI the app falls back to data/*.json on disk, and Render's
# filesystem is EPHEMERAL: on the free plan that data is wiped on every deploy and
# whenever the service spins down after inactivity.

services:
  - type: web
    name: english-coach
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"

      # Set these in the Render dashboard. sync:false keeps them out of this file
      # and out of the repository.
      - key: APP_PASSCODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_STT_MODEL
        sync: false
      - key: OPENAI_SPEECH_BASE_URL
        sync: false
      - key: OPENAI_SPEECH_API_KEY
        sync: false

      # MongoDB Atlas. Without it, data does not survive a deploy (see the note above).
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: english_coach

      # Your Render URL, so the browser is allowed to call the API from it.
      - key: ALLOWED_ORIGINS
        sync: false
